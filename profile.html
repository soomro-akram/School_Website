<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Profile</title>

<link rel="stylesheet" href="profile.css">

</head>

<body>

<div class="profile-container">

    <div class="profile-card">

        <img src="student.png" id="profileImage" class="profile-img">

        <h2 id="studentName"></h2>

        <p class="student-id">Student Dashboard</p>

        <div class="info">

            <div class="row">
                <span>👤 Username</span>
                <strong id="username"></strong>
            </div>

            <div class="row">
                <span>📧 Email</span>
                <strong id="email"></strong>
            </div>

            <div class="row">
                <span>🎓 Class</span>
                <strong>10th</strong>
            </div>

            <div class="row">
                <span>🆔 Roll No</span>
                <strong>2026001</strong>
            </div>

            <div class="row">
                <span>📱 Phone</span>
                <strong>0300-1234567</strong>
            </div>

            <div class="row">
                <span>📍 Address</span>
                <strong>Padidan, Sindh</strong>
            </div>

            <div class="row">
                <span>📄 Admission</span>
                <strong style="color:green;">Approved</strong>
            </div>

        </div>

        <div class="buttons">

            <button onclick="window.location='student-dashboard.html'">
                Dashboard
            </button>

            <button onclick="logout()" class="logout">
                Logout
            </button>

        </div>

    </div>

</div>

<script>

let user = JSON.parse(localStorage.getItem("user"));

if(user){

document.getElementById("studentName").innerHTML=user.username;

document.getElementById("username").innerHTML=user.username;

document.getElementById("email").innerHTML=user.email;

}else{

window.location="login.html";

}

function logout(){

localStorage.removeItem("loggedIn");

window.location="index.html";

}

</script>

</body>

</html>
