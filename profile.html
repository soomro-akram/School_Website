<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Profile</title>

<link rel="stylesheet" href="profile.css">

</head>

<body>

<div class="profile-container">

    <div class="profile-card">

       <img src="student.png" id="profileImage" class="profile-img">

        <input type="file" id="imageInput" accept="image/*">

        <h2 id="studentName"></h2>

        <p class="student-id">Student Dashboard</p>

        <div class="info">

            <div class="row">
                <span>👤 Username</span>
                <strong id="username"></strong>
            </div>

            <div class="row">
                <span>📧 Email</span>
                <strong id="email"></strong>
            </div>

         <div class="row">
    <span>🎓 Class</span>
    <input type="text" id="studentClass" placeholder="Enter Class">
</div>

<div class="row">
    <span>🆔 Roll No</span>
    <input type="text" id="rollNo" placeholder="Enter Roll No">
</div>

<div class="row">
    <span>📱 Phone</span>
    <input type="text" id="phone" placeholder="Enter Phone Number">
</div>

<div class="row">
    <span>📍 Address</span>
    <input type="text" id="address" placeholder="Enter Address">
</div>
        </div>
        <div class="buttons">
            <button onclick="saveProfile()">
                Save Profile
            </button>

            <button onclick="logout()" class="logout">
                Logout
            </button>

        </div>

    </div>

</div>

<script>

let user = JSON.parse(localStorage.getItem("user"));

if(user){

document.getElementById("studentName").innerHTML = user.username;
document.getElementById("username").innerHTML = user.username;
document.getElementById("email").innerHTML = user.email;

document.getElementById("studentClass").value = user.class || "";
document.getElementById("rollNo").value = user.rollNo || "";
document.getElementById("phone").value = user.phone || "";
document.getElementById("address").value = user.address || "";

if(user.image){
document.getElementById("profileImage").src = user.image;
}

}else{
window.location="login.html";
}

document.getElementById("imageInput").addEventListener("change",function(){

let file=this.files[0];

if(file){

let reader=new FileReader();

reader.onload=function(e){

document.getElementById("profileImage").src=e.target.result;

user.image=e.target.result;

localStorage.setItem("user",JSON.stringify(user));

}

reader.readAsDataURL(file);

}

});

function saveProfile(){

user.class=document.getElementById("studentClass").value;
user.rollNo=document.getElementById("rollNo").value;
user.phone=document.getElementById("phone").value;
user.address=document.getElementById("address").value;

localStorage.setItem("user",JSON.stringify(user));

alert("Profile Saved Successfully!");

}
    
function logout(){

localStorage.removeItem("loggedIn");

window.location="index.html";

}

</script>

</body>

</html>
